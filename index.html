<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>英语学习</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main id="app" class="app-shell"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button data-route="home" class="nav-button active" type="button">
        <img class="nav-icon" src="assets/icons/phosphor/house.svg" alt="">
        <span>今日</span>
      </button>
      <button data-route="lessons" class="nav-button" type="button">
        <img class="nav-icon" src="assets/icons/phosphor/books.svg" alt="">
        <span>课程</span>
      </button>
      <button data-route="speaking" class="nav-button" type="button">
        <img class="nav-icon" src="assets/icons/phosphor/chats-circle.svg" alt="">
        <span>对话</span>
      </button>
      <button data-route="review" class="nav-button" type="button">
        <img class="nav-icon" src="assets/icons/phosphor/arrows-counter-clockwise.svg" alt="">
        <span>复习</span>
      </button>
      <button data-route="settings" class="nav-button" type="button">
        <img class="nav-icon" src="assets/icons/phosphor/gear.svg" alt="">
        <span>设置</span>
      </button>
    </nav>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
